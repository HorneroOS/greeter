# Packaging hygiene and the unit suite. Job ids `packaging` and `tests` are
# required status checks on main; keep them stable.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: PKGBUILD hygiene (layered snippet, no /etc/sddm.conf rewrite, no media)
        run: |
          grep -q 'sddm.conf.d' packaging/arch/hornero-greeter/PKGBUILD
          grep -q 'usr/share/sddm/themes/hornero' packaging/arch/hornero-greeter/PKGBUILD
          grep -q '^\[Theme\]' packaging/arch/hornero-greeter/hornero.conf
          ! grep -q '>/etc/sddm.conf' packaging/arch/hornero-greeter/PKGBUILD
          ! grep -q 'etc/sddm.conf"' packaging/arch/hornero-greeter/PKGBUILD
          ! grep -q 'media-base' packaging/arch/hornero-greeter/PKGBUILD
          grep -q '0644' packaging/arch/hornero-greeter/PKGBUILD
          echo 'packaging hygiene OK'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - run: python3 -m pip install -q pytest
      - run: python3 -m pytest tests/ -q
