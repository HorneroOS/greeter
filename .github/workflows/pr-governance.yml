---
# Thin caller for the shared HorneroOS PR-governance engine.
#
# The engine lives in HorneroOS/.github (`governance/danger`) and is
# versioned by `governance-*` tags: callers pin a full commit SHA with a
# version comment (currently governance-v1.7).
#
# Fork-safe: triggers on `pull_request` (never `pull_request_target`
# combined with checkout + execution of PR code). Least privilege below.

name: PR governance

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    # yamllint disable rule:line-length
    uses: HorneroOS/.github/.github/workflows/pr-governance.yml@8c6433197e84706df8e2fa024a427421235b908e  # governance-v1.7
    # yamllint enable rule:line-length
    with:
      # Same engine pin as `uses:` above.
      engine-ref: 8c6433197e84706df8e2fa024a427421235b908e
    permissions:
      contents: read
      pull-requests: write
