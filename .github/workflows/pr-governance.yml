---
# Thin caller for the shared HorneroOS PR-governance engine.
#
# The engine lives in HorneroOS/.github (`governance/danger`) and is
# versioned by `governance-*` tags: callers pin a full commit SHA with a
# version comment (currently governance-v1.9).
#
# Fork-safe: triggers on `pull_request` (never `pull_request_target`
# combined with checkout + execution of PR code). Least privilege below.

name: PR governance

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    # yamllint disable rule:line-length
    uses: HorneroOS/.github/.github/workflows/pr-governance.yml@a00ec6f92f7a4eb7637f51a0becfe92a5e361df4  # governance-v1.9
    # yamllint enable rule:line-length
    with:
      # Same engine pin as `uses:` above.
      engine-ref: a00ec6f92f7a4eb7637f51a0becfe92a5e361df4
    permissions:
      contents: read
      pull-requests: write
