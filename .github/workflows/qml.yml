name: qml
on:
  push:
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 QML tooling
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev qt6-multimedia-dev python3-pytest nodejs
      - name: QML lint and format check
        run: sh scripts/qml-lint.sh
      - name: Unit tests
        run: python3 -m pytest tests/ -q
