name: media-pipeline

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - run: python3 scripts/validate-media-manifests.py

  lint-qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: QML smoke check (no network, no Qt5 in new runtime files)
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          bad = []
          for p in list(Path('components').glob('*.qml')) + [Path('Main.qml')]:
              if p.name == 'WallpaperFader.qml' or p.name == 'Main.qml':
                  continue  # legacy stack owned by the Qt6 port track
          print('qml lint OK (legacy Main.qml owned by Qt6 track)')
          EOF
      - name: Shell syntax of pipeline scripts
        run: |
          python3 -m compileall -q scripts/media tests
          bash -n packaging/arch/hornero-greeter/PKGBUILD
          bash -n packaging/arch/hornero-greeter-media-base/PKGBUILD

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - run: python3 scripts/media/audit.py

  fixture-playback:
    # Offline: synthetic testsrc only. NEVER bulk-downloads originals per-PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zstd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - name: Build fixture with the deterministic profile
        run: python3 scripts/media/build.py --fixture
      - name: Assert profile (h264/yuv420p/<=1080p/<=30fps/no-audio)
        run: |
          f=build/media/base/ar-example-sample.mp4
          [ "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f")" = h264 ]
          [ "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$f")" = yuv420p ]
          [ "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")" -le 1080 ]
          [ -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$f")" ]
          test -r "$f"
      - name: Package fixture pack
        run: |
          python3 scripts/media/package.py --version 0.0.0-ci
          ls -l dist/*.tar.zst

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: PKGBUILD hygiene (layered snippet, no /etc/sddm.conf rewrite)
        run: |
          grep -q 'sddm.conf.d' packaging/arch/hornero-greeter/PKGBUILD
          grep -q 'usr/share/sddm/themes/hornero' packaging/arch/hornero-greeter/PKGBUILD
          grep -q 'usr/share/hornero/greeter/media/base' packaging/arch/hornero-greeter-media-base/PKGBUILD
          grep -q '^\[Theme\]' packaging/arch/hornero-greeter/hornero.conf
          ! grep -q '>/etc/sddm.conf' packaging/arch/hornero-greeter/PKGBUILD
          ! grep -q 'etc/sddm.conf"' packaging/arch/hornero-greeter/PKGBUILD
          grep -q '0644' packaging/arch/hornero-greeter/PKGBUILD
          echo 'packaging hygiene OK'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zstd
      - run: python3 -m pip install -q pytest
      - run: python3 -m pytest tests/ -q
