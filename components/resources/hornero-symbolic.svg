<!-- HorneroOS symbolic mark (white flattened variant for video overlay).
Provenance: derived from HorneroOS/config assets/brand/logo-mono.svg
(MIT, (c) HorneroOS contributors). Mechanical change only: paint fills
#000 -> #fff for legibility over footage (QtSvg has no currentColor),
mask geometry untouched. GPL-3.0-only as part of this theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="HorneroOS symbolic mark">
  <title>HorneroOS symbolic mark (light)</title>
  <desc>White single-color mark for overlay on video. Bird knocked out of the disc.</desc>
  <defs>
    <mask id="hornero-greeter-knockout">
      <circle cx="128" cy="124" r="86" fill="#fff"/>
      <g fill="#000">
        <path d="M100,168 L52,206 L70,212 L114,180 Z"/>
        <ellipse cx="124" cy="140" rx="34" ry="42" transform="rotate(-12 124 140)"/>
        <circle cx="140" cy="92" r="24"/>
        <path d="M160,85 C169,88 180,93 189,100 L160,105 Z"/>
        <circle cx="146" cy="88" r="6" fill="#fff"/>
      </g>
    </mask>
  </defs>
  <circle cx="128" cy="124" r="86" fill="#fff" mask="url(#hornero-greeter-knockout)"/>
  <path d="M36,200 C90,188 166,188 220,200" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
</svg>
