[General]
# Hornero greeter settings. Every key is optional; these are the defaults.
# Administrators override them in theme.conf.user next to this file
# (see README "Settings"). The greeter runs as the sddm user before any
# session exists, so it never reads a user's Control Center palette.

# Palette: auto follows the platform light/dark preference when SDDM's
# platform reports one, and is Signal Night otherwise; night | day force it.
colorScheme=auto
highContrast=false
largeText=false
reducedMotion=false

# Copy: auto follows the system locale (Spanish for es_*, else English).
language=auto
# Greeting voice: cozy (the shell's warm voice) | plain.
voice=cozy
# Javi, the hornero, beside the greeting.
mascot=true

# Background: horizon (generative Pampa horizon, drawn in code) | plain.
background=horizon
# Ambient scan hairline on the main output (one step per second); always
# off with reducedMotion or highContrast.
backgroundMotion=true
# Integer to pin the generative sky; empty = new sky each day per machine.
backgroundSeed=
# OPT-IN: your own picture or video (absolute path, or relative to this
# theme). Nothing is bundled. Videos need qt6-multimedia; when the file is
# missing or cannot be decoded the generative horizon stays.
backgroundImage=
# Ground wash over your own media, 0.3 to 0.9.
backgroundDim=0.55

# Accounts as channels; "Other" lets people type a user name.
showUserChannels=true
allowOtherUser=true
# Ask before suspend, restart and shut down.
confirmPower=true

virtualKeyboardAvailable=false
virtualKeyboardEnabled=false
timeFormat="hh:mm"
dateFormat="dddd d MMMM yyyy"
showLoginButton=true
showTopBar=true
autofocusInput=true
# Station ident: the Hornero mark drawn in the palette's signal colour;
# brandingLogo may name your own logo file (e.g. components/resources/
# hornero-symbolic.svg); brandingEnabled=false hides the custom logo.
brandingEnabled=true
brandingLogo=
